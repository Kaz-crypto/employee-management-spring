<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>社員管理システム</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <h1 th:if="${employee.id == null}">
        社員登録
    </h1>

    <h1 th:unless="${employee.id == null}">
        社員編集
    </h1>

    <div class="card mt-3">

        <div class="card-body">

            <form
                th:action="@{/employees}"
                th:object="${employee}"
                method="post">

                <input
                    type="hidden"
                    th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">
                        名前
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{name}">

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        年齢
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        th:field="*{age}">

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('age')}"
                        th:errors="*{age}">
                    </div>

                </div>

                <button
                    class="btn btn-success"
                    type="submit"
                    th:if="${employee.id == null}">
                    社員登録
                </button>

                <button
                    class="btn btn-warning"
                    type="submit"
                    th:unless="${employee.id == null}">
                    更新
                </button>

                <a
                    th:href="@{/employees}"
                    class="btn btn-secondary">
                    一覧へ戻る
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
