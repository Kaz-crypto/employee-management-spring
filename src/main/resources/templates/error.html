<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>エラー</title>

<link

    rel="stylesheet">

</head>
<body class="container mt-5">

    <div class="alert alert-danger">

        <h3>エラーが発生しました</h3>

    </div>

    <a

        一覧へ戻る

    </a>

</body>
</html>
